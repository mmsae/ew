<!-- Logic for Cookie Popup Count -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 1. Get current count from browser storage (default to 0 if never visited)
        let visitCount = localStorage.getItem('ew_cookie_visit_count') || 0;
        
        // 2. Increment the count
        visitCount = parseInt(visitCount) + 1;
        
        // 3. Save the new count back to storage
        localStorage.setItem('ew_cookie_visit_count', visitCount);

        // 4. If count is 3 or less, show the popup
        if (visitCount <= 3) {
            var cookieModal = new bootstrap.Modal(document.getElementById('cookiePopup'));
            cookieModal.show();
        } else {
            console.log("Cookie popup skipped: User has visited " + visitCount + " times.");
        }
    });
</script>
